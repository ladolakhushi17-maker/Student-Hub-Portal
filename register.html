<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Hub Portal</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header>

    <button id="themeButton" class="theme-button" type="button">
        🌙 Dark Mode
    </button>

    <h1>STUDENT HUB PORTAL</h1>

</header>


<!-- ==========================================
     STUDENT REGISTRATION FORM
     ========================================== -->

<form id="registrationForm" novalidate>

    <h2>Student Registration</h2>

    <br>


    <!-- First Name -->

    <label for="firstName">First Name</label>

    <input
        type="text"
        id="firstName"
        name="firstName"
        placeholder="Enter Your First Name"
        autocomplete="given-name"
        required>

    <small id="firstNameError" class="error-message"></small>

    <br>


    <!-- Last Name -->

    <label for="lastName">Last Name</label>

    <input
        type="text"
        id="lastName"
        name="lastName"
        placeholder="Enter Your Last Name"
        autocomplete="family-name"
        required>

    <small id="lastNameError" class="error-message"></small>

    <br>


    <!-- Email -->

    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter Your Email"
        autocomplete="email"
        required>

    <small id="emailError" class="error-message"></small>

    <br>


    <!-- Mobile Number -->

    <label for="mobile">Mobile Number</label>

    <input
        type="tel"
        id="mobile"
        name="mobile"
        placeholder="Enter Your Mobile Number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
        required>

    <small id="mobileError" class="error-message"></small>

    <br>


    <!-- Username -->

    <label for="username">Username</label>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Make Your Username"
        autocomplete="username"
        required>

    <small id="usernameError" class="error-message"></small>

    <br>


    <!-- Student ID -->

    <label for="studentId">ID</label>

    <input
        type="text"
        id="studentId"
        name="studentId"
        placeholder="Enter Student ID"
        required>

    <small id="studentIdError" class="error-message"></small>

    <br>


    <!-- Course -->

    <label for="course">Course</label>

    <select id="course" name="course" required>

        <option value="">Select Course</option>
        <option value="BCA">BCA</option>
        <option value="BTech">B.Tech</option>
        <option value="BBA">BBA</option>
        <option value="MCA">MCA</option>
        <option value="MTech">M.Tech</option>

    </select>

    <small id="courseError" class="error-message"></small>

    <br>


    <!-- Year -->

    <label for="year">Year</label>

    <select id="year" name="year" required>

        <option value="">Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>

    </select>

    <small id="yearError" class="error-message"></small>

    <br>


    <!-- Gender -->

    <label>Gender</label>

    <div class="gender-options">

        <label>
            <input
                type="radio"
                name="gender"
                value="Male"
                required>
            Male
        </label>

        <label>
            <input
                type="radio"
                name="gender"
                value="Female">
            Female
        </label>

        <label>
            <input
                type="radio"
                name="gender"
                value="Other">
            Other
        </label>

    </div>

    <small id="genderError" class="error-message"></small>

    <br>


    <!-- Password -->

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter Password"
        autocomplete="new-password"
        required>

    <small id="passwordError" class="error-message"></small>

    <br>


    <!-- Confirm Password -->

    <label for="confirmPassword">Confirm Password</label>

    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm Your Password"
        autocomplete="new-password"
        required>

    <small id="confirmPasswordError" class="error-message"></small>

    <br>


    <!-- Role -->

    <label for="role">Role</label>

    <select id="role" name="role" required>

        <option value="">Select Role</option>
        <option value="Student">Student</option>
        <option value="Faculty">Faculty</option>
        <option value="Admin">Admin</option>

    </select>

    <small id="roleError" class="error-message"></small>

    <br>


    <!-- Terms and Conditions -->

    <div class="terms">

        <label for="terms">

            <input
                type="checkbox"
                id="terms"
                name="terms"
                required>

            I agree to the Terms and Conditions.

        </label>

    </div>

    <small id="termsError" class="error-message"></small>

    <br>


    <!-- Success Message -->

    <p id="successMessage"></p>


    <!-- Buttons -->

    <input type="submit" value="Register">

    <input type="reset" value="Clear form">


    <!-- Login -->

    <p>Already User??</p>

    <br>

    <a href="Login.html" class="login-btn">Login</a>

</form>


<!-- ==========================================
     FOOTER
     ========================================== -->

<footer>

    <div class="footer-container">

        <div class="footer-section">

            <h2>StudentHub Portal</h2>

            <p>
                Your digital campus companion for academics,
                courses, assignments, attendance, and student services.
            </p>

        </div>

    </div>

    <p class="copyright">
        © 2026 StudentHub Portal | All Rights Reserved.
    </p>

</footer>


<!-- JavaScript -->

<script src="script.js"></script>

</body>
</html>
